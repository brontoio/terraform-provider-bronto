          type: integer
          description: The timestamp when the monitor was created
          format: int64
          example: 1710948395538
        status:
          type: string
          description: The status of the monitor
          example: OK
          enum:
          - ALERT
          - OK
        last_trigger_ts:
          type: integer
          description: The timestamp of the last time the monitor fired
          format: int64
          example: 1710948395538
