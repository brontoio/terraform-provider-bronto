components:
  schemas:
    ApiKey:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier for the API key
          format: uuid
        name:
          type: string
          description: The name of the API key
          example: Production API Key
        created_at:
          type: integer
          description: The timestamp when the API key was created
          format: int64
          example: 1710948395538
        api_key:
          type: string
          description: The first 8 characters of the API key. Note its not possible
            to retrieve the key after creation time.
          example: 2ad85149
        roles:
          type: object
          description: A list of api key role ids
          example:
          - SearchApi
          - IngestionApi
    ErrorResponse:
      required:
      - code
      - correlation_id
      - message
      type: object
      properties:
        code:
          minimum: 200
          type: integer
          description: The http response code.
          format: int32
        correlation_id:
          type: string
          description: The unique identifier for the request.
        message:
          type: string
    CreateApiKeyRequest:
      required:
      - name
      - roles
      type: object
      properties:
        name:
          maxLength: 255
          minLength: 1
          type: string
          description: The name of the API key to create
          example: Production API Key
        roles:
          type: object
          description: A list of api key role ids
          example:
          - IngestionApi
    UpdateApiKeyRequest:
      type: object
      properties:
        name:
          maxLength: 255
          minLength: 1
          type: string
          description: The new name for the API key
          example: Production API Key
        roles:
          type: object
          description: A list of api key role ids
          example:
          - IngestionApi
    User:
      required:
      - email
      - first_name
      - id
      - last_name
      type: object
      properties:
        id:
          type: string
          description: The unique identifier for the user
          format: uuid
        first_name:
          type: string
          description: The user's first name
          example: John
        last_name:
          type: string
          description: The user's last name
          example: Doe
        email:
          type: string
          description: The user's email address
          format: email
          example: john@company.com
        roles:
          type: object
          description: A list of role ids
          example:
          - ReadOnly
          - Standard
    CreateUserRequest:
      required:
      - email
      - first_name
      - last_name
      - roles
      type: object
      properties:
        first_name:
          maxLength: 255
          minLength: 1
          type: string
          description: The user's first name
          example: Alice
        last_name:
          maxLength: 255
          minLength: 1
          type: string
          description: The user's last name
          example: Smith
        email:
          type: string
          description: The user's email address
          format: email
          example: alice@company.com
        roles:
          type: array
          items:
            type: string
          description: A list of role ids
          example:
            - "Admin"
            - "Standard"
            - "ReadOnly"
    UpdateUserRequest:
      type: object
      properties:
        first_name:
          maxLength: 255
          minLength: 1
          type: string
          description: The user's first name
          example: Alice
        last_name:
          maxLength: 255
          minLength: 1
          type: string
          description: The user's last name
          example: Smith
        roles:
          type: array
          items:
            type: string
          description: A list of role ids
          example: ["Admin", "Standard", "ReadOnly"]
    QueryExplain:
      type: object
      properties:
        Execution time (millis):
          type: string
          description: Measure of time taken to execute the query.
          example: "353"
    QueryResult:
      type: object
      properties:
        '@time':
          type: string
          description: Human readable timestamp of when this log event was ingested
          example: 2024-03-27 10:25:40.632 UTC
        '@sequence':
          type: string
          description: The sequence number of this log event. Note sequence numbers
            are only unique within a millisecond timestamp.
          example: "111721913"
        '@raw':
          type: string
          description: The full log line as received
          example: 10.0.0.1 - - [27/Mar/2024:10:54:39 +0000] "GET / HTTP/1.1" 200
            721 "-" "ELB-HealthChecker/2.0"
        '@context':
          type: string
          description: A url that can be used to get the log events before and after
            this log event.
          format: uri
          example: https://api.brontobytes.io/context?sequence=111721913&limit=1&from=23746675-7022-4985-bd74-4af9eba58d72&timestamp=1711535140632&direction=both
        metadata:
          type: object
          properties:
            logId:
              type: string
              description: The unique identifier of the log this log event came from
              format: uuid
            timestamp:
              type: integer
              description: The timestamp of when this log event was ingested
              example: 1711535140632
            sequence:
              type: integer
              description: The sequence number of this log event. Note sequence numbers
                are only unique within a millisecond timestamp.
              example: 111721913
            origin:
              type: string
              description: The identity of the sender if this log event.
              example: 10.0.0.1
            context:
              type: string
              description: A url that can be used to get the log events before and
                after this log event.
              format: uri
              example: https://api.brontobytes.io/context?sequence=111721913&limit=1&from=23746675-7022-4985-bd74-4af9eba58d72&timestamp=1711535140632&direction=both
            selectedKeys:
              type: object
              description: The selected columns displayed in this result
              example:
                '@time': 2024-03-27 10:25:40.632 UTC
            unselectedKeys:
              type: object
              description: The available columns not displayed in this result
              example:
                id: message_0
                current_time: 1711535140
    Event:
      type: object
      properties:
        '@raw':
          type: string
          description: The log message as received
          example: 10.0.108.203 - - [27/May/2024:23:47:27 +0000] "GET / HTTP/1.1"
            200 675 "-" "ELB-HealthChecker/2.0"
        '@time':
          type: string
          description: |
            Human readable time of when this event was ingested into Bronto Bytes. The time is in UTC and in the format "YYYY-MM-DD HH:MM:SS.MMM UTC"
          example: 2024-05-27 23:26:34.331 UTC
        message_kvs:
          type: object
          description: Key-value pairs extracted from the log message
          example:
            method: GET
            statusCode: "200"
            path: /
        attributes:
          type: object
          description: |
            Additional details attached to the log event, such as resource attributes, environment settings, or custom attributes defined by the user.
          example:
            $private_ip: 10.0.22.230
            $environment: production
        metadata:
          type: object
          properties:
            service_id:
              type: string
              description: The unique identifier of the service this event came from.
              format: uuid
              example: 23746675-7022-4985-bd74-4af9eba58d72
            timestamp:
              type: integer
              description: Unix timestamp in milliseconds of when this event was ingested.
              example: 1716853347801
            sequence:
              type: integer
              description: The sequence number of this log event. Note sequence numbers
                are only unique within a millisecond timestamp.
              example: 111721913
            context:
              type: string
              description: A url that can be used to get the events before and after
                this event.
              format: uri
              example: |
                "https://api.eu.brontobytes.io/context?sequence=213&from=37bdf479-7c95-4e81-982a-25d0680fb602&timestamp=1716853354331&direction=both"
          description: The metadata of the event
    Group:
      type: object
      properties:
        group:
          type: string
          description: The groupby key or keys used by this group
          example: '[US]'
        count:
          type: integer
          description: The number of times this group appeared in the logs
          format: int64
          example: 124
        stat:
          type: string
          description: The statistical function applied to the group
          example: average(bytes)
        value:
          type: number
          description: Overall value of the statistical function applied
          format: double
          example: 50325.25
        timeseries:
          type: array
          items:
            $ref: '#/components/schemas/GroupTimeSeries'
    GroupSeriesItem:
      type: object
      properties:
        name:
          type: string
          description: The group name
          example: host123
        count:
          type: integer
          description: The number of times this group appeared in the logs
          format: int64
          example: 124
        stat:
          type: string
          description: The statistical function applied to the group
          example: average(duration_millis)
        value:
          type: number
          description: Overall value of the statistical function applied
          format: double
          example: 50325.25
        series_resolution_ms:
          type: number
          description: The resolution of the timeseries in milliseconds
          format: int64
          example: 60000
        timeseries:
          type: array
          items:
            $ref: '#/components/schemas/GroupTimeSeries'
        groups_series:
          type: array
          description: The subgroups of the group (multi group-by)
          items:
            type: object
            properties:
              name:
                type: string
                description: The group name
                example: host123
              count:
                type: integer
                description: The number of times this group appeared in the logs
                format: int64
                example: 124
              stat:
                type: string
                description: The statistical function applied to the group
                example: average(duration_millis)
              value:
                type: number
                description: Overall value of the statistical function applied
                format: double
                example: 50325.25
              series_resolution_ms:
                type: number
                description: The resolution of the timeseries in milliseconds
                format: int64
                example: 60000
              timeseries:
                type: array
                items:
