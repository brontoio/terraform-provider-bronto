    get:
      summary: Get a time series log based metric by its ID
      operationId: getLbmById
      parameters:
      - name: lbm_id
        in: path
        description: The ID of the LBM to retrieve
        required: true
        schema:
          type: string
      - name: time_range
        in: query
        description: |
          The time period for which to query data. Either `time_range` or both `from_ts` and `to_ts`  must be provided. If `time_range` is provided, it will take precedence
        required: false
        schema:
          type: string
        example: '''Last 20 minutes'', ''Last 2 hours'', ''Last 3 days'''
      - name: from_ts
        in: query
        description: |
          The starting unix time in milliseconds for which to query data. Either `time_range` or both  `from_ts` and `to_ts` must be provided. If `time_range` is provided, it will take precedence.
        required: false
        schema:
          type: integer
        example: 1709251200000
      - name: to_ts
        in: query
        description: |
          The ending unix time in milliseconds for which to query data. Either `time_range` or both `from_ts` and `to_ts` must be provided. If `time_range` is provided, it will take precedence.
        required: false
        schema:
          type: integer
        example: 1711390455601
      responses:
        "200":
          description: LBM is retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricItem'
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "429":
          description: Too Many Request - Fair usage limits exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Internal Server Error - An error occurred on the server side.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          description: Unexpected Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
