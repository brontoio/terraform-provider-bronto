openapi: 3.0.2
info:
  title: BrontoBytes API
  license:
    name: Commercial
  version: 1.0.0
servers:
- url: https://api.eu.brontobytes.io
- url: https://api.us.brontobytes.io
security:
- ApiKeyAuth: []
- BearerAuth: []
paths:
