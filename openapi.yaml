      required:
      - actions
      - comparison_operator
      - created_at
      - filter
      - id
      - logs
      - name
      - stat
      - status
      - threshold
      - window
      type: object
      properties:
        id:
          type: string
          description: The unique identifier for the monitor
          format: uuid
        name:
          maxLength: 255
          minLength: 1
          type: string
          description: The name of the monitor
          example: High Error Rate
        description:
          maxLength: 4000
          type: string
          description: Extra contextual information to add to the monitor.
          example: Average response time is over 1 seconds in the last 20 minutes
        filter:
          maxLength: 255
          type: string
          description: The filter used to identify events to monitor on.
          example: response_time and response_status=200
        key:
          maxLength: 50
          type: string
          description: The key that identifies the numeric value to monitor
          example: response_time
        stat:
          type: string
          description: The function to compute (MIN, MAX, COUNT, SUM, AVG)
          example: AVG
          enum:
          - MIN
          - MAX
          - COUNT
          - SUM
          - AVG
          - AVERAGE
        comparison_operator:
          type: string
          description: the comparison operator of the monitor (ABOVE, ABOVE_OR_EQUAL,
            BELOW, BELOW_OR_EQUAL, EQUAL, NOT_EQUAL)
          example: ABOVE
          enum:
          - BELOW
          - BELOW_OR_EQUAL
          - ABOVE
          - ABOVE_OR_EQUAL
          - EQUAL
          - NOT_EQUAL
        threshold:
          type: number
          description: the threshold value of the monitor
          format: double
          example: 1000
        window:
          type: integer
          description: the time window, expressed in minutes, to evaluate the monitor
          example: 20
        logs:
          maxItems: 20
          minItems: 1
          uniqueItems: true
          type: array
          description: The list of log identifiers to filter for matching events
          items:
            type: string
            format: uuid
        actions:
          maxItems: 10
          minItems: 1
          type: array
          description: The list on actions (notifications) to take when the monitor
            fires or resolves
