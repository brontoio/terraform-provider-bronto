provider:
  name: bronto
resources:
  user:
    create:
      path: /users
      method: POST
    read:
      path: /users/{userId}
      method: GET
    update:
      path: /users/{userId}
      method: PATCH
    delete:
      path: /users/{userId}
      method: DELETE
    schema:
      attributes:
        aliases:
          userId: id