name: Tests

on:
  pull_request:
    paths-ignore:
      - 'README.md'
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
      - run: go build -v .

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
      - run: go vet ./...
      - run: go test -v -cover ./...

  docs:
    name: Docs are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - run: go install github.com/hashicorp/terraform-plugin-docs/cmd/tfplugindocs@latest
      # --provider-name is required because this repo's directory name
      # doesn't follow the terraform-provider-<name> convention
      # tfplugindocs assumes by default.
      - run: tfplugindocs generate --provider-name bronto
      - name: Fail if docs are out of date
        run: |
          git diff --compact-summary --exit-code -- docs/ || \
            (echo; echo "Docs are out of date. Run 'tfplugindocs generate --provider-name bronto' and commit the result."; exit 1)

  fmt:
    name: Terraform fmt (examples)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - run: terraform fmt -recursive -check ./examples
